# Critères du comparatif : pondération par défaut et notes sur 10.
#
# Ce fichier est la SOURCE des données du classement. Après modification :
#     just donnees      (régénère le bloc JS de _includes/report-body.html)
#     just artifact     (régénère report.body.html)
#
# poids_defaut     position initiale du curseur, 0 à 10. Seul compte le poids
#                  relatif : le total est normalisé à l'affichage.
# notes            0 à 10, toujours dans le même sens (10 = favorable).
#                  Une ville sans note pour un critère est écartée du calcul
#                  de ce critère, jamais comptée comme zéro.
# notes_issues_de  « calculee »    : dérivée d'un jeu de données par la méthode
#                                    décrite, reproductible par un script.
#                  « appreciation » : lecture argumentée des données du critère.
#
# Règle d'or (CLAUDE.md) : aucun chiffre estimé. Pas de source, pas de note.
- id: devops
  nom: Emploi DevOps
  poids_defaut: 10
  source: API Recherche d'entreprises
  methode: Établissements actifs en NAF 62.01Z, 62.02A et 63.11Z rapportés à 1 000 habitants ; plus il
    est élevé, mieux c'est. La note étale cet indicateur de 1 à 10 sur les seules villes classées, les
    villes de référence étant placées sur la même échelle. Le barème se recalibre si le panel change.
  notes_issues_de: calculee
  notes:
    Rennes: 7.5
    Grenoble: 8.6
    Chambéry: 3.3
    Montpellier: 10.0
    Toulon: 1.0
    Paris: 10.0
- id: cip
  nom: Emploi CIP
  poids_defaut: 10
  source: API Recherche d'entreprises
  methode: Associations actives en NAF 88.99B rapportées à 1 000 habitants ; plus il est élevé, mieux
    c'est. La note étale cet indicateur de 1 à 10 sur les seules villes classées, les villes de référence
    étant placées sur la même échelle. Le barème se recalibre si le panel change.
  notes_issues_de: calculee
  notes:
    Rennes: 4.5
    Grenoble: 10.0
    Chambéry: 6.5
    Montpellier: 4.4
    Toulon: 1.0
    Paris: 10.0
- id: immo
  nom: Logement 15 km
  poids_defaut: 7
  source: Carte des loyers (DHUP)
  methode: Loyer d'annonce moyen dans un rayon de 15 km, en €/m² ; moins il est élevé, mieux c'est. La
    note étale cet indicateur de 1 à 10 sur les seules villes classées, les villes de référence étant
    placées sur la même échelle. Le barème se recalibre si le panel change.
  notes_issues_de: calculee
  notes:
    Rennes: 10.0
    Grenoble: 5.9
    Chambéry: 4.9
    Montpellier: 1.1
    Toulon: 1.0
    Paris: 0.0
- id: climat
  nom: Climat
  poids_defaut: 5
  source: Météo-France, climatologie de base
  methode: 'Beau temps sans sécheresse : ensoleillement (40 %), rareté des canicules au-dessus de 30 °C
    (30 %) et rareté des jours de pluie (30 %), le tout minoré si le cumul de juin à août tombe sous 120
    mm. Chaque composante est étalée sur les seules villes classées, les villes de référence étant placées
    sur la même échelle. Les poids sont réglables dans le champ « parametres » de ce fichier.'
  notes_issues_de: calculee
  notes:
    Rennes: 3.7
    Grenoble: 1.9
    Chambéry: 2.6
    Montpellier: 6.3
    Toulon: 5.8
    Paris: 3.5
  parametres:
    commentaire: 'Préférence déclarée : du beau temps sans sécheresse. L''ensoleillement compte positivement,
      les canicules et les jours de pluie négativement ; un été trop sec applique un malus. Modifiez ces
      poids pour changer le critère sans toucher au code.'
    poids_soleil: 0.4
    poids_canicule: 0.3
    poids_jours_pluie: 0.3
    seuil_pluie_ete_mm: 120
    malus_secheresse_max: 0.6
